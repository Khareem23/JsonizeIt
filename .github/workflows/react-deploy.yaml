name: Deploy Frontend React 

on:
  push:
    paths:
      - 'JsonizeIt.Frontend.SPA/**'       # only trigger when frontend files change
    branches:
      - develop                # or your deploy branch (e.g. master/dev)
  pull_request:
    paths:
      - 'JsonizeIt.Frontend.SPA/**'       # only trigger when frontend files change
    branches:
      - develop
    types: [opened, synchronize, closed]




jobs:
  build_ci_job:
    name: Building WEB docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo code for Workflow Access
        uses: actions/checkout@v2
      - name: Build the Docker image
        id: BuildX
        uses: docker/setup-buildx-action@v1
      - name: Docker Hub Login
        uses: docker/login-action@v1
        with: 
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - name: Build Image and push to Registry
        uses: docker/build-push-action@v2
        with: 
          context: .
          file: ./Dockerfile
          push: true
          tags: 'kareem234/jsonizeit-web:latest'

  deploy_cd_job:
    name: Deploy Image From Registry to VPS
    runs-on: ubuntu-latest
    needs: build_ci_job
    steps:
      - name: Pulling new image and deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker image pull kareem234/jsonizeit-web

            docker container stop Jsonize-Web || true

            docker container prune -f

            docker run -d --name Jsonize-Web --network decloud23_network --restart unless-stopped -p 5202:80 kareem234/jsonizeit-web:latest

            docker image prune -f 
            
            # Ensure firewalld is running
            sudo systemctl start firewalld || true
            
            sudo firewall-cmd --add-port=80/tcp --permanent
            sudo firewall-cmd --add-port=443/tcp --permanent
            sudo firewall-cmd --add-port=5202/tcp --permanent

            sudo firewall-cmd --reload
